name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install "flet[all]"

      - name: Setup project config
        run: |
          ls -la
          cat << 'EOF' > pyproject.toml
          [project]
          name = "kristall_pos_mobile"
          version = "2.0.1"
          description = "КРИСТАЛЛ-ПОС: Мобильная касса"
          authors = [{ name = "ЗАО «НПО Кристалл-Софт»" }]
          dependencies = ["flet>=1.0.0"]

          [tool.flet]
          org = "ru.kristallsoft.pos"
          product = "КРИСТАЛЛ-ПОС"
          company = "ЗАО «НПО Кристалл-Софт»"
          copyright = "© 2026 ЗАО «НПО Кристалл-Софт»"

          [tool.flet.android]
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_ADMIN",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.CAMERA"
          ]
          EOF

      - name: Build Android APK
        run: flet build apk --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kristall-POS-Android
          path: build/apk/*.apk
